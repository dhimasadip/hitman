openapi: 3.2.1
info:
  title: Hitman Spike API 3.2
  version: 1.0.0
  description: OpenAPI 3.2 fixture using QUERY via additionalOperations and itemSchema.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/bas:
    get:
      operationId: listBas32
      summary: List BA records
      responses:
        "200":
          description: A list of BA records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ba"
    additionalOperations:
      QUERY:
        operationId: queryBas32
        summary: Query BA records
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
        responses:
          "200":
            description: Matching records
            content:
              application/x-ndjson:
                itemSchema:
                  $ref: "#/components/schemas/Ba"
components:
  schemas:
    Ba:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
