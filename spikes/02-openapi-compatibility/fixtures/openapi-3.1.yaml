openapi: 3.1.0
info:
  title: Hitman Spike API 3.1
  version: 1.0.0
  description: OpenAPI 3.1 fixture with nullable types and webhooks.
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/bas:
    get:
      operationId: listBas31
      summary: List BA records
      parameters:
        - name: limit
          in: query
          schema:
            type: [integer, "null"]
            minimum: 1
      responses:
        "200":
          description: A list of BA records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ba"
    post:
      operationId: createBa31
      summary: Create a BA record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBa"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ba"
webhooks:
  baChanged:
    post:
      operationId: baChanged
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Ba"
      responses:
        "204":
          description: Accepted
components:
  schemas:
    Ba:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: [string, "null"]
    CreateBa:
      type: object
      required: [name]
      properties:
        name:
          type: string
