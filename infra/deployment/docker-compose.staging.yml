name: hitman-staging

x-node-service: &node-service
  image: ${HITMAN_NODE_IMAGE:-hitman-node:local}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitman}
      POSTGRES_USER: ${POSTGRES_USER:-hitman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/deployment/Dockerfile.node
      args:
        APP: server
    command: ["node", "packages/database/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hitman}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hitman}
      DATABASE_SSL: "false"
      APP_ENV: staging
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  server:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/deployment/Dockerfile.node
      args:
        APP: server
    environment:
      NODE_ENV: production
      APP_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: "8080"
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      SESSION_TTL_SECONDS: "604800"
      LOGIN_RATE_LIMIT_MAX: "10"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
      DATABASE_URL: postgres://${POSTGRES_USER:-hitman}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hitman}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: "10"
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      SECRET_PROVIDER: env
      OBJECT_STORAGE_DRIVER: disabled
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]

  worker:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/deployment/Dockerfile.node
      args:
        APP: worker
    environment:
      NODE_ENV: production
      APP_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-hitman}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hitman}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: "5"
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      SECRET_PROVIDER: env
      OBJECT_STORAGE_DRIVER: disabled
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]

  web:
    image: ${HITMAN_WEB_IMAGE:-hitman-web:local}
    build:
      context: ../..
      dockerfile: infra/deployment/Dockerfile.web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
