global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: staging

rule_files:
  - /etc/prometheus/hitman-alerts.yml

scrape_configs:
  - job_name: hitman-server
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["server:8080"]
        labels:
          service: hitman-server

  - job_name: hitman-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["worker:8081"]
        labels:
          service: hitman-worker
