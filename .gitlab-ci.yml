stages:
  - validate
  - test
  - build
  - security
  - deploy

default:
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.14.0 --activate
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  variables:
    PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

lint:
  stage: validate
  image: node:24.22.0-bookworm-slim
  script:
    - pnpm exec biome check .
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

typecheck:
  stage: validate
  image: node:24.22.0-bookworm-slim
  script:
    - pnpm typecheck

migration:check:
  stage: validate
  image: node:24.22.0-bookworm-slim
  services:
    - name: postgres:16.15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hitman_test
    POSTGRES_USER: hitman
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgres://hitman@postgres:5432/hitman_test
  script:
    - pnpm db:check
    - pnpm db:migrate
    - pnpm db:migrate

test:typescript:
  stage: test
  image: node:24.22.0-bookworm-slim
  services:
    - name: postgres:16.15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hitman_test
    POSTGRES_USER: hitman
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: postgres://hitman@postgres:5432/hitman_test
  script:
    - pnpm test

test:go:
  stage: test
  image: golang:1.27.3-bookworm
  before_script: []
  script:
    - cd runner-go && go vet ./... && go test ./...
    - cd ../spikes/02-networking && go vet ./... && go test ./...

build:typescript:
  stage: build
  image: node:24.22.0-bookworm-slim
  script:
    - pnpm build

build:runner:
  stage: build
  image: golang:1.27.3-bookworm
  before_script: []
  script:
    - cd runner-go
    - go build -trimpath -ldflags "-s -w -X github.com/hitman-api-hub/hitman/runner-go/internal/version.Version=${CI_COMMIT_TAG:-0.1.0} -X github.com/hitman-api-hub/hitman/runner-go/internal/version.Commit=${CI_COMMIT_SHA}" -o bin/hitman-runner ./cmd/hitman-runner
  artifacts:
    paths:
      - runner-go/bin/hitman-runner

validate:compose:
  stage: build
  image: docker:27-cli
  before_script: []
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    POSTGRES_PASSWORD: compose-validation-only
    METRICS_TOKEN: compose-validation-token-0123456789
  script:
    - docker compose -f infra/deployment/docker-compose.staging.yml config --quiet

security:node-audit:
  stage: security
  image: node:24.22.0-bookworm-slim
  script:
    - pnpm audit --prod --audit-level=high
  allow_failure: true

security:go-vuln:
  stage: security
  image: golang:1.27.3-bookworm
  before_script: []
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - cd runner-go && "$(go env GOPATH)/bin/govulncheck" ./...
    - cd ../spikes/02-networking && "$(go env GOPATH)/bin/govulncheck" ./...
  allow_failure: true

security:secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks detect --source . --no-banner --redact --verbose
  allow_failure: true

deploy:staging:
  stage: deploy
  image: docker:27-cli
  before_script: []
  tags:
    - hitman-staging
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  environment:
    name: staging
    url: https://hitman-staging.local
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - test -f .env.staging
    - docker compose -f infra/deployment/docker-compose.staging.yml --env-file .env.staging up -d --build --wait
  allow_failure: false
